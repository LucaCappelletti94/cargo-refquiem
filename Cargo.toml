[package]
name = "refquiem"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Cappelletti"]
description = "A cargo requiem for the refs your Rust code left behind"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/cargo-refquiem"
keywords = ["cargo-subcommand", "documentation", "stale", "cli", "rustdoc"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/fuzz", "/.clusterfuzzlite", "/sonar-project.properties"]

[[bin]]
name = "cargo-refquiem"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
# Entry points for the fuzz targets in fuzz/, not a stable API.
fuzzing2 = []

[dependencies]
clap = { version = "4.6.6", features = ["derive"], optional = true }
gix = { version = "0.89.0", default-features = false, features = ["revision", "sha1"] }
hashbrown = { version = "0.17.1", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
ignore = "0.4.33"
fst = "0.4.7"
pulldown-cmark = { version = "0.13.4", default-features = false }
ra-ap-rustc_lexer = "0.177.0"
# Unicode 17 like unicode-properties 0.1.4, which ra-ap-rustc_lexer requires to match.
unicode-ident = ">=1.0.22, <1.0.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing"] }
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde"] }
cargo_metadata = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true

[profile.mutants]
inherits = "test"
debug = "none"

[lints]
workspace = true

[workspace]
members = ["xtask"]

[workspace.lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
