# The keys must match the SonarQube Cloud project import exactly.
sonar.organization=lucacappelletti94-github
sonar.projectKey=LucaCappelletti94_cargo-refquiem
sonar.projectName=cargo-refquiem

sonar.sources=src,tests,xtask/src
# Inline #[cfg(test)] modules stay classified as sources.
sonar.test.inclusions=tests/**
sonar.exclusions=target/**,fuzz/**
# The vocab job checks xtask by regenerating data/, no test runs it.
sonar.coverage.exclusions=xtask/**
sonar.sourceEncoding=UTF-8

sonar.rust.cargo.manifestPaths=Cargo.toml

sonar.rust.lcov.reportPaths=lcov.info
